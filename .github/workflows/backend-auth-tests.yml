name: Backend Auth Tests

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aiuser
          POSTGRES_PASSWORD: aipass
          POSTGRES_DB: aiplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies from manifest
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations (upgrade head)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://aiuser:aipass@localhost:5432/aiplatform_test
        run: |
          alembic -c alembic.ini upgrade head

      - name: Run pytest backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://aiuser:aipass@localhost:5432/aiplatform_test
        run: |
          pytest tests/ -v

      - name: Run Alembic downgrade base (verify reversible)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://aiuser:aipass@localhost:5432/aiplatform_test
        run: |
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head
